name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        working-directory: services/api
        run: uv sync --locked
      - name: Run tests
        working-directory: services/api
        run: uv run pytest

  voice-worker:
    name: Voice worker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        working-directory: services/voice-worker
        run: uv sync --locked
      - name: Compile worker modules
        working-directory: services/voice-worker
        run: >-
          uv run python -m py_compile
          agent.py tools.py memory.py screen_reader.py session_state.py
          stt_provider.py stt_settings.py http_headers.py
          ../../infra/runpod/scripts/audio_smoke_test.py
          ../../infra/runpod/scripts/bootstrap_models.py
          ../../infra/runpod/scripts/health_server.py
      - name: Run voice worker unit tests
        working-directory: services/voice-worker
        run: uv run python -m unittest discover -s tests -v
