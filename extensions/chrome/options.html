<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Auren Page Reader settings</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      main {
        max-width: 420px;
        margin: 2rem auto;
      }
      label {
        display: grid;
        gap: 0.35rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      input {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.25);
        color: var(--ink);
        padding: 0.65rem 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Settings</h1>
      <p class="sub">
        Local development can leave the bearer token empty when the API uses
        <code>DEV_USER_ID</code>. With Clerk enabled, paste a session JWT.
      </p>
      <label>
        API base URL
        <input id="apiBaseUrl" type="url" placeholder="http://127.0.0.1:8081" />
      </label>
      <label>
        Bearer token (optional)
        <input id="bearerToken" type="password" autocomplete="off" />
      </label>
      <button id="save" type="button">Save</button>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
