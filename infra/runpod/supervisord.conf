[unix_http_server]
file=/run/auren-supervisor.sock
chmod=0770
chown=root:root

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/auren-supervisord.pid
childlogdir=/workspace/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/auren-supervisor.sock

[program:ollama]
priority=10
command=/usr/local/bin/ollama serve
autostart=true
autorestart=unexpected
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:speaches]
priority=20
directory=/opt/speaches
command=/opt/speaches/.venv/bin/uvicorn --factory --host 127.0.0.1 --port 8000 speaches.main:create_app --log-level info
autostart=true
autorestart=unexpected
startsecs=10
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:chatterbox]
priority=20
directory=/opt/chatterbox
command=/opt/chatterbox/.venv/bin/python server.py
environment=HF_HOME="/workspace/models/chatterbox-hf",HF_HUB_CACHE="/workspace/models/chatterbox-hf/hub",HF_HUB_ENABLE_HF_TRANSFER="0"
autostart=true
autorestart=unexpected
startsecs=20
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:model-bootstrap]
priority=30
command=/usr/bin/python3 /opt/auren/bin/bootstrap_models.py
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=1
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:voice-worker]
priority=40
command=/opt/auren/bin/start-worker.sh
autostart=true
autorestart=true
startsecs=10
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:health-server]
priority=50
command=/usr/bin/python3 /opt/auren/bin/health_server.py
autostart=true
autorestart=unexpected
startsecs=2
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:idle-watchdog]
priority=60
command=/usr/bin/python3 /opt/auren/bin/idle_watchdog.py
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=2
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
